name: Supabase migrations

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:

concurrency:
  group: supabase-migrate
  cancel-in-progress: false

# Runs after merge. The CI "migrations" job has already applied these files to a fresh local Supabase on the pull request.
jobs:
  push-migrations:
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.120.0

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Show pending migrations
        run: supabase migration list

      - name: Push migrations
        run: supabase db push

  # A failed push must not go unnoticed: this workflow failed silently for weeks once. Production's schema is
  # behind main whenever it fails. Runs outside the production environment, so it uses the repository webhook secret.
  notify-failure:
    name: tell Discord
    needs: push-migrations
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Post failure to Discord
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$WEBHOOK_URL" ] || { echo "no webhook configured"; exit 0; }
          python3 - <<'PY'
          import json, os, urllib.request
          env = os.environ
          embed = {
              "title": "Production migrations failed",
              "url": env["RUN_URL"],
              "color": 0xED4245,
              "description": "The Supabase push did not complete, so the production database is behind main. Check the run log (an invalid access token is the usual cause).",
              "fields": [
                  {"name": "Commit", "value": f"`{env['SHA'][:7]}` by {env['ACTOR']}", "inline": True},
              ],
              "footer": {"text": env["REPO"]},
          }
          req = urllib.request.Request(
              env["WEBHOOK_URL"],
              data=json.dumps({"embeds": [embed]}).encode(),
              headers={"Content-Type": "application/json", "User-Agent": "homecare-ops-migrations"},
          )
          urllib.request.urlopen(req, timeout=15)
          PY
