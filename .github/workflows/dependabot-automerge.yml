name: Dependabot auto-merge

# Patch-only: once "CI ok" passes, GitHub merges Dependabot pull requests whose every updated package is a
# patch release. Minor and major updates are left for a human. Needs "Allow auto-merge" in the repo settings
# and "CI ok" as a required check on main (branch protection), which is what actually gates the merge.
#
# pull_request_target runs with a token that can write, so this workflow must never check out or run the
# pull request's code. It only reads Dependabot's metadata and calls the GitHub CLI.

on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - name: Enable auto-merge when every update is a patch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          UPDATES: ${{ steps.metadata.outputs.updated-dependencies-json }}
        run: |
          non_patch=$(echo "$UPDATES" | jq '[.[] | select(.updateType != "version-update:semver-patch")] | length')
          total=$(echo "$UPDATES" | jq 'length')
          echo "updates: $total, not patch: $non_patch"
          if [ "$total" -gt 0 ] && [ "$non_patch" -eq 0 ]; then
            gh pr merge --auto --squash "$PR_URL"
          else
            echo "not patch-only; leaving it for a human"
          fi
