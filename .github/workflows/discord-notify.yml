name: Discord CI Notifications

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - "**.md"
      - "**.mdx"
      - "docs/**"

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Send message to Discord
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_ACTION: ${{ github.event.action }}
          ACTOR: ${{ github.actor }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ["REPO"]
          sha = os.environ["SHA"][:7]
          if os.environ["EVENT"] == "pull_request":
              content = (
                  f"🔀 PR #{os.environ['PR_NUMBER']} {os.environ['PR_ACTION']} "
                  f"by **{os.environ['ACTOR']}** in **{repo}**: "
                  f"{os.environ['PR_TITLE']}\n{os.environ['PR_URL']}"
              )
          else:
              content = f"🚀 New push to **{repo}** (`{sha}`)"
          message = {"content": content}

          request = urllib.request.Request(
              os.environ["WEBHOOK_URL"],
              data=json.dumps(message).encode(),
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "homecare-ops-ci (github-actions)",
              },
              method="POST",
          )

          with urllib.request.urlopen(request) as response:
              print("Discord notified:", response.status)
          PY
