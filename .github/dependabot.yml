# Weekly updates. Actions are pinned to commit SHAs, so Dependabot is what keeps them from going stale:
# it bumps the SHA and the version comment together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Groups only carry minor and patch updates. A major version arrives as its own pull request, so one
    # breaking upgrade (TypeScript, ESLint, vitest) cannot sink a whole group.
    groups:
      mui:
        patterns: ["@mui/*", "@emotion/*"]
        update-types: ["minor", "patch"]
      next-react:
        patterns: ["next", "eslint-config-next", "react", "react-dom", "@types/react", "@types/react-dom"]
        update-types: ["minor", "patch"]
      supabase:
        patterns: ["@supabase/*"]
        update-types: ["minor", "patch"]
      dev-dependencies:
        dependency-type: development
        exclude-patterns: ["eslint-config-next", "@types/react", "@types/react-dom"]
        update-types: ["minor", "patch"]
